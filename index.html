<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <div class="container">
        <div class="left">
            <div class="logo-bar">
                <img src="images/odin.png" alt="Odin Logo">
            </div>
        </div>

        <div class="right">
            <p class="intro">
                This is not a real online service! You know you need something like thsi in your life to help you
                realize your deepest dreams. Sign up <i>now</i> to get started.
            <p>You <i>know</i> you want to.</p>
            </p>
            <h4>Let's do this!</h4>

            <form action="">
                <div class="form-grid">
                    <div>
                        <label for="first_name">FIRST NAME</label>
                        <input type="text">
                    </div>

                    <div>
                        <label for="last_name">LAST NAME</label>
                        <input type="text">
                    </div>

                    <div>
                        <label for="email">EMAIL</label>
                        <input type="email" name="email" id="email">
                    </div>

                    <div>
                        <label for="phone_number">PHONE NUMBER</label>
                        <input type="number" name="phone_number" id="phone_number">
                    </div>

                    <div>
                        <label for="password">PASSWORD</label>
                        <input type="password" name="password" id="password">   
                    </div>

                    <div>
                        <label for="confirm_password">CONFIRM PASSWORD</label>
                        <input type="password" name="confirm_password id="confirm_password">
                    </div>

                    <button type="submit">Create Account</button>

                    <p>Already have an account? <a href="#">Log In</a></p>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
